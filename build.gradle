plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.carpinchoia'
base { archivesName = 'carpincho_ia' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { carpincho_ia { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // API del Simple Voice Chat (solo para compilar; el mod real lo pone el jugador)
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['Specification-Title': 'carpincho_ia', 'Implementation-Version': project.version])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
